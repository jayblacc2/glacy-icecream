<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="../images/icons/favicon.png" type="image/x-icon" />
    <title>Login - Glacy Store</title>
    <link rel="stylesheet" href="../css/tokens.css" />
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/login.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Roboto+Slab:wght@400;700&family=Yanone+Kaffeesatz:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Minimal Nav -->
    <nav class="login-nav">
      <a href="../index.html" class="login-nav-brand">
        <img src="../images/icons/logo.svg" alt="Glacy Store" />
      </a>
    </nav>

    <main class="login-page">
      <div class="login-card">
        <!-- Tab Switcher -->
        <div class="login-tabs">
          <button class="login-tab active" data-tab="login">Sign In</button>
          <button class="login-tab" data-tab="signup">Sign Up</button>
        </div>

        <!-- Login Form -->
        <form class="login-form-page" id="login-form">
          <div class="form-group-login">
            <label for="login-email">Email</label>
            <div class="input-wrapper-login">
              <i class="fa-solid fa-envelope"></i>
              <input type="email" id="login-email" placeholder="you@example.com" required />
            </div>
          </div>
          <div class="form-group-login">
            <label for="login-password">Password</label>
            <div class="input-wrapper-login">
              <i class="fa-solid fa-lock"></i>
              <input type="password" id="login-password" placeholder="Enter your password" required />
              <button type="button" class="toggle-password" data-target="login-password">
                <i class="fa-solid fa-eye"></i>
              </button>
            </div>
          </div>
          <div class="login-options">
            <label class="remember-me">
              <input type="checkbox" id="remember-me" />
              <span>Remember me</span>
            </label>
            <a href="#" class="forgot-link">Forgot password?</a>
          </div>
          <button type="submit" class="login-btn-page" id="login-submit">
            <span class="btn-text">Sign In</span>
            <span class="btn-loader"><i class="fa-solid fa-circle-notch fa-spin"></i></span>
          </button>
          <div class="login-divider">
            <span>or</span>
          </div>
          <p class="login-switch-text">
            Don't have an account? <button type="button" class="switch-tab" data-tab="signup">Sign Up</button>
          </p>
        </form>

        <!-- Signup Form -->
        <form class="login-form-page signup-form-page visually-hidden" id="signup-form">
          <div class="form-group-login">
            <label for="signup-name">Full Name</label>
            <div class="input-wrapper-login">
              <i class="fa-solid fa-user"></i>
              <input type="text" id="signup-name" placeholder="John Doe" required minlength="3" />
            </div>
          </div>
          <div class="form-group-login">
            <label for="signup-email">Email</label>
            <div class="input-wrapper-login">
              <i class="fa-solid fa-envelope"></i>
              <input type="email" id="signup-email" placeholder="you@example.com" required />
            </div>
          </div>
          <div class="form-group-login">
            <label for="signup-password">Password</label>
            <div class="input-wrapper-login">
              <i class="fa-solid fa-lock"></i>
              <input type="password" id="signup-password" placeholder="Min 8 characters" required minlength="8" />
              <button type="button" class="toggle-password" data-target="signup-password">
                <i class="fa-solid fa-eye"></i>
              </button>
            </div>
          </div>
          <div class="form-group-login">
            <label for="signup-confirm">Confirm Password</label>
            <div class="input-wrapper-login">
              <i class="fa-solid fa-lock"></i>
              <input type="password" id="signup-confirm" placeholder="Re-enter password" required />
            </div>
          </div>
          <button type="submit" class="login-btn-page signup-btn-page" id="signup-submit">
            <span class="btn-text">Create Account</span>
            <span class="btn-loader"><i class="fa-solid fa-circle-notch fa-spin"></i></span>
          </button>
          <p class="login-switch-text">
            Already have an account? <button type="button" class="switch-tab" data-tab="login">Sign In</button>
          </p>
        </form>

        <!-- Error display -->
        <div class="login-error visually-hidden" id="login-error"></div>
      </div>
    </main>

    <!-- Toast -->
    <div id="toast-container"></div>

    <script type="module" src="../script/login.js"></script>
    <script type="module" src="../utils/toast-notification.js"></script>
  </body>
</html>
